<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calc</title>
    <link rel="stylesheet" href="clone.css">
</head>

<body>
    <div>
        <div class="calculator">
            <input type="text" placeholder="0">
            <div class="keypad">
                <button class="tin">AC</button>
                <button>00</button>
                <button>%</button>
                <button class="pin">&div;</button>
            </div>
            <div  class="keypad">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="pin">&times;</button>
            </div>
            <div class="keypad">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="pin">-</button>
            </div>
            <div class="keypad">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="pin">+</button>
            </div>
            <div class="keypad">
                <button class="kin">0</button>
                <button>.</button>
                <button class="pin">=</button>
            </div>
        </div>
    </div>
</body>
</html>
